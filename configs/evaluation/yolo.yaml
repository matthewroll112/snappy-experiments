model: yolo

validation:
  batch_size: 1
  num_workers: 4
  subsets:
    - all
    - water_occlusion
    - overlap

experiments:
  - name: rgb_seed13
    dataset: base
    modality: rgb
    seed: 13
    checkpoint: results/yolo/rgb_lr5e-05_minlr5e-07_wd1e-04_best.pth

  - name: rgb_seed42
    dataset: base
    modality: rgb
    seed: 42
    checkpoint: results/yolo/rgb_lr5e-05_minlr5e-07_wd1e-04_seed42_best.pth

  - name: rgb_seed123
    dataset: base
    modality: rgb
    seed: 123
    checkpoint: results/yolo/rgb_lr5e-05_minlr5e-07_wd1e-04_seed123_best.pth

  - name: early_da2_seed13
    dataset: da2
    modality: rgbd
    fusion_stage: early
    seed: 13
    checkpoint: results/yolo/early_da2_lr1e-04_minlr1e-06_wd2e-04_best.pth

  - name: early_da2_seed42
    dataset: da2
    modality: rgbd
    fusion_stage: early
    seed: 42
    checkpoint: results/yolo/early_da2_lr1e-04_minlr1e-06_wd2e-04_seed42_best.pth

  - name: early_da2_seed123
    dataset: da2
    modality: rgbd
    fusion_stage: early
    seed: 123
    checkpoint: results/yolo/early_da2_lr1e-04_minlr1e-06_wd2e-04_seed123_best.pth

  - name: late_partial_add_lingbot_seed13
    dataset: lingbot
    modality: rgbd
    fusion_stage: late_partial
    fusion_type: add
    seed: 13
    checkpoint: results/yolo/late_partial_add_lingbot_lr1e-04_minlr1e-06_wd2e-04_best.pth

  - name: late_partial_add_lingbot_seed42
    dataset: lingbot
    modality: rgbd
    fusion_stage: late_partial
    fusion_type: add
    seed: 42
    checkpoint: results/yolo/late_partial_add_lingbot_lr1e-04_minlr1e-06_wd2e-04_seed42_best.pth

  - name: late_partial_add_lingbot_seed123
    dataset: lingbot
    modality: rgbd
    fusion_stage: late_partial
    fusion_type: add
    seed: 123
    checkpoint: results/yolo/late_partial_add_lingbot_lr1e-04_minlr1e-06_wd2e-04_seed123_best.pth